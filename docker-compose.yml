name: comprehendme

services:
  pg:
    image: bitnami/postgresql
    ports:
      - "2508:5432"
    environment:
        POSTGRES_USER: docker
        POSTGRES_PASSWORD: docker
        POSTGRES_DB: comprehendme
    volumes:
      - pg-data:/var/lib/postgresql/pg-data

  dragonfly:
    image: 'docker.dragonflydb.io/dragonflydb/dragonfly'
    ports:
      - "6500:6379"
    ulimits:
      memlock: -1
    volumes:
      - dragonflydata:/data
    command: ["--proactor_threads=4", "--maxmemory=1gb", "--default_lua_flags=allow-undeclared-keys"]

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb local/comprehendme --ignore-existing;
      mc anonymous set download local/comprehendme;
      exit 0;
      "

volumes:
   pg-data:
   dragonflydata:
   minio-data:
